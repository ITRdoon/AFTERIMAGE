function grow(el){requestAnimationFrame(function(){requestAnimationFrame(function(){el.querySelectorAll('i[data-w]').forEach(function(i){i.style.width=i.dataset.w+'%'})})})}
function sent(g,live){return '<p class="sent">'+g.p+' <span class="blank">'+(live&&pick>=0?g.o[pick][0]:'…')+'</span></p>'}
function render(){var d=document.documentElement,t=T[lang];d.lang=lang;d.dir=lang==='ar'?'rtl':'ltr';
document.querySelectorAll('[data-k]').forEach(function(e){e.innerHTML=t[e.dataset.k]});
document.querySelectorAll('.lg button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.l===lang)});
var h=document.getElementById('hero');h.innerHTML=sent(t.G[1],0)+rows(t.G[1],0);grow(h);
document.getElementById('gseg').innerHTML=t.G.map(function(g,k){return '<button data-g="'+k+'" aria-pressed="'+(k===gi)+'">'+g.p+'</button>'}).join('');
var L=document.getElementById('lab'),g=t.G[gi];L.innerHTML=sent(g,1)+rows(g,1)+'<p class="note">'+t.note+'</p>'+(pick>=0?'<p class="ins">'+t.ins+'</p>':'');grow(L);
document.getElementById('dseg').innerHTML=t.D.map(function(x,k){return '<button data-d="'+k+'" aria-pressed="'+(k===di)+'">'+x.tm+' · '+x.n+'</button>'}).join('');
var x=t.D[di];document.getElementById('day').innerHTML='<p class="time">'+x.tm+'</p><b>'+t.lg+'</b><p>'+x.g+'</p><b>'+t.lh+'</b><p>'+x.h+'</p><b>'+t.lw+'</b><p>'+x.w+'</p>';
document.title=t.kick+' · '+T.en.title}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
if(b.dataset.g!==undefined){gi=+b.dataset.g;pick=-1;render()}
else if(b.dataset.d!==undefined){di=+b.dataset.d;render()}
else if(b.dataset.p!==undefined){pick=+b.dataset.p;render()}
else if(b.dataset.l){lang=b.dataset.l;try{localStorage.setItem('lang',lang)}catch(x){}render()}
else if(b.classList.contains('opt')){var q=b.closest('[data-quiz]');q.querySelectorAll('.opt').forEach(function(o){o.classList.add(o.dataset.ok==='1'?'right':'wrong');o.disabled=true});q.querySelector('.reveal').classList.add('on')}});
function show(i,sc){cur=i;seen[i]=1;tabs.forEach(function(x,k){x.setAttribute('aria-selected',k===i);x.classList.toggle('done',!!seen[k]&&k!==i)});
secs.forEach(function(s,k){s.classList.toggle('on',k===i)});pr.forEach(function(p,k){p.classList.toggle('f',k<=i)});
document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===3;
if(sc)window.scrollTo({top:document.getElementById('nav').offsetTop,behavior:'smooth'})}
tabs.forEach(function(t){t.addEventListener('click',function(){show(+t.dataset.i,1)})});
document.getElementById('prev').onclick=function(){show(cur-1,1)};
document.getElementById('next').onclick=function(){show(cur+1,1)};
document.getElementById('start').onclick=function(){window.scrollTo({top:document.getElementById('nav').offsetTop,behavior:'smooth'})};
render();show(0,0);
})();
</script>
</body>
</html>
